[project]
name = "lesson-codebase-navigator"
version = "0.1.0"
description = "代码库导航器——一个具备检索、工具和记忆能力的增强型 LLM"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.4.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",  # 固定版本以确保 x86_64 macOS 能解析兼容的 wheel；ARM64 上可移除
    "numpy<2",  # torch 2.2.x（x86_64 macOS）基于 NumPy 1.x 编译；ARM64 上可移除
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
