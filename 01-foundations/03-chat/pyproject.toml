[project]
name = "lesson-chat"
version = "0.1.0"
description = "第 2 课：带消息历史记录的交互式聊天（Anthropic 和 OpenAI）"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",  # Anthropic API 客户端
    "common",
    "openai>=1.0.0",  # OpenAI API 客户端
    "python-dotenv>=1.0.0",  # 环境变量管理
    "rich>=13.7.0",  # 美化终端输出
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
