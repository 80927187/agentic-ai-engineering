[project]
name = "lesson-evaluator-optimizer"
version = "0.1.0"
description = "评估器—优化器：生成、评估与改进循环"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
