[project]
name = "lesson-human-in-the-loop"
version = "0.1.0"
description = "人在回路——用于人工审核和批准的关键检查点"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
