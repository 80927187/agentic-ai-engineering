[project]
name = "lesson-prompt-chaining"
version = "0.1.0"
description = "提示词链——将任务拆分为连续的 LLM 调用"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
