[project]
name = "lesson-tracing-debugging"
version = "0.1.0"
description = "课程：追踪与调试——可观测性、执行追踪和故障分析"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
