[project]
name = "lesson-unit-testing-agents"
version = "0.1.0"
description = "课程：代理单元测试——模拟大语言模型响应并以确定性的方式测试代理行为"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
