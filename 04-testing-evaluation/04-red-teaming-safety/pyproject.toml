[project]
name = "lesson-red-teaming-safety"
version = "0.1.0"
description = "课程：红队测试与安全——对抗性测试、提示词注入与护栏"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
